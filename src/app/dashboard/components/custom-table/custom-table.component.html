<div class="bill-table-container">
  <table class="bill-table">
    <thead>
      <tr>
        <th *ngFor="let h of headers">{{ h }}</th>
        <th>
          <button class="plus-circle" (click)="execItemInsertion()">
            <i class="fa-solid fa-plus"></i>
          </button>
        </th>
      </tr>
    </thead>
    <tbody>
      @for(item of bodyContent; track $index) {
        <tr>
          <td>{{ item.InvoiceNumber }}</td>
          <td>{{ item.Doctor }}</td>
          <td>{{ item.Paciente }}</td>
          <td>{{ item.FechaFactura.split('T')[0] }}</td>
          <td>{{ item.Estado }}</td>
          <td>{{ item.Monto }}</td>
          <td>
            <div class="opts">
              <div class="opts-btns action"><i class="ph ph-eye"></i></div>
              <div class="opts-btns delete"
                  (click)="execItemDeletion(item.InvoiceNumber )">
                <i class="ph ph-trash-simple"></i>
              </div>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
