<div class="header-container">
  <div class="header-detail">
    <h2>{{ headerText }}</h2>
    <span class="badge info">{{ itemCounter }}</span>
  </div>
  <div class="table-actions">
    <app-search-bar (searchTermChange)="execSearchTerm($event)"></app-search-bar>

    <button *ngIf="btnRouterLink; else drawerTrigger" class="create-button" [routerLink]="btnRouterLink">
      <i class="ph-bold ph-plus"></i>
      <span class="btn-txt">Crear Nuevo</span>
    </button>

    <ng-template #drawerTrigger>
      <button class="create-button" (click)="execDrawerTrigger()">
        <i class="ph-bold ph-plus"></i>
        <span class="btn-txt">Crear Nuevo</span>
      </button>
    </ng-template>


  </div>
</div>
