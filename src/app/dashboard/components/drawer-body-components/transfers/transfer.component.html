<form class="transfer-form" [formGroup]="invoiceForm" (ngSubmit)="onHandleSubmit()">
    <div class="form-group">
        <label for="subinv">Subinventario</label>
        <select id="subinv" formControlName="subinv">
            <option value="">Selecciona una subinventario</option>
            <option value="2">Emergencia</option>
            <option value="3">Quirofano</option>
            <option value="4">Hospitalización</option>
        </select>
        <small class="error-text" *ngIf="invoiceForm.get('subinv')?.touched && invoiceForm.get('subinv')?.hasError('required')">
          Selecciona un subinventario.
        </small>
    </div>
    <div class="form-group">
        <label for="qty">Cantidad</label>
        <select id="qty" formControlName="qty">
            <option value="">Selecciona una qty</option>
            @for (q of itemQuantity; track q) {
                <option [value]="q">{{ q }}</option>
            }
        </select>
        <small class="error-text" *ngIf="invoiceForm.get('qty')?.touched && invoiceForm.get('qty')?.hasError('required')">
          Selecciona una cantidad.
        </small>
    </div>

    <div class="form-actions">
        <button 
            class="btn cancel"
            type="button"
            (click)="onHandleCancel()"
        >
            Cancelar
        </button>
        <button 
            class="btn submit"
            type="submit"
        >
            Generar
        </button>
    </div>
</form>
