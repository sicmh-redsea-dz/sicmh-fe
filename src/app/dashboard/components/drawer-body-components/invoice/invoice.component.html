<div class="toggle-container">
  <p>SAR</p>
  <input 
    class="input-toggle" 
    type="checkbox"
    id="toggle-switch"
    defaultChecked>
  <label for="toggle-switch" class="toggle-switch"></label>
</div>

<div class="invoice-form">
  <div class="form-group">
    <label for="customer">Cliente</label>
    <select id="customer" name="customer">
      <option value="">Selecciona un cliente</option>
      <option value="1">Cliente 1</option>
      <option value="2">Cliente 2</option>
      <option value="3">Cliente 3</option>
    </select>
  </div>

  <div class="form-group">
    <label for="customer">Doctor</label>
    <select id="customer" name="customer">
      <option value="">Selecciona un cliente</option>
      <option value="1">Cliente 1</option>
      <option value="2">Cliente 2</option>
      <option value="3">Cliente 3</option>
    </select>
  </div>

  <div class="form-group">
    <label for="date">Fecha</label>
    <input type="date" id="date" name="date">
  </div>

  <div class="form-group">
    <label for="amount">Monto</label>
    <input type="number" id="amount" name="amount" placeholder="0.00">
  </div>

  <div class="form-group">
    <label for="description">Descripción</label>
    <textarea id="description" name="description" rows="3" placeholder="Detalles de la factura"></textarea>
  </div>

  <div class="form-actions">
    <button type="reset" class="btn cancel">Cancelar</button>
    <button type="submit" class="btn submit">Generar</button>
  </div>
</div>
