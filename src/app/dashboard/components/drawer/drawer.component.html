<div [ngClass]="{'drawer-overlay': true, 'show': isDrawerVisible()}">
  <div [ngClass]="{'drawer': true, 'open': isDrawerVisible()}">
    <div class="drawer-header">
      <div class="drawer-title">
        <h2>{{drawerHeader().header}}</h2>
        <span
          class="drawer-badge"
          *ngIf="bodyToDisplay() === dcInvoice && drawerHeader().badge"
          [class.paid]="drawerHeader().badgeTone === 'paid'"
        >
          {{ drawerHeader().badge }}
        </span>
      </div>
      <button (click)="setDrawerVisibility()">
        <i class="icon fa-solid fa-x"></i>
      </button>
    </div>
    <div class="drawer-body">
      @if ( bodyToDisplay() === dcInvoice ) {
        <app-drawer-invoice />
      }
      @else if ( bodyToDisplay() === dcTransfer ) {
        <app-transfer />
      }
      @else if ( bodyToDisplay() === dcPatientView ) {
        <app-patient-view />
      }
      @else {
        <p>There is no available content for this drawer.</p>
      }
    </div>
  </div>
</div>
