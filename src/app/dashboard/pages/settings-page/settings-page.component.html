<div class="settings-shell">
  <aside class="settings-nav">
    <div class="nav-header">
      <div class="nav-avatar">
        <i class="ph-bold ph-user"></i>
      </div>
      <div class="nav-user">
        <span class="nav-title">Configuraciones</span>
        <span class="nav-subtitle">Personaliza tu cuenta</span>
      </div>
    </div>

    <div class="nav-section">
      <span class="section-label">Cuenta</span>
      <a
        [routerLink]="['my-profile']"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        <i class="ph-bold ph-user-circle"></i>
        Mi perfil
      </a>
    </div>

    <div class="nav-section" *ngIf="canManagePermissions()">
      <span class="section-label">Administración</span>
      <a
        [routerLink]="['permissions']"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        <i class="ph-bold ph-shield-check"></i>
        Permisos
      </a>
      <a
        [routerLink]="['staff']"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link"
      >
        <i class="ph-bold ph-users-three"></i>
        Personal médico
      </a>
    </div>
  </aside>

  <section class="settings-content">
    <div class="settings-panel">
      <router-outlet></router-outlet>
    </div>
  </section>
</div>
