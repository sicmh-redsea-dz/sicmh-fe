<custom-header
    [showCreateButton]="false"
    [itemCounter]="totalRegistries"
    [headerText]="'Subinventario 1'"
    [inputPlaceholder]="'Buscar producto...'"
    [isDwnldRerportLoading]="downloadingPdfReport"
    (searchTerm)="onSearchTermChange($event)"
/>

<section *ngIf="bodyContent.length > 0; else nodata">

    <div class="inv-table-container">
        <table class="inv-table">
            <thead>
                <tr>
                    <th *ngFor="let h of headers">{{ h }}</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                @for ( item of bodyContent; track $index ) {
                    <tr>
                        <td>{{ item.id }}</td>
                        <td>{{ item.prodName }}</td>
                        <td>{{ item.prodDesc }}</td>
                        <td>{{ item.prodQuantity }}</td>
                        <td>{{ item.prodUnitPrice }}</td>
                        <td 
                            class="opts-wrapper" 
                            (click)="$event.stopPropagation()" 
                            (keydown)="$event.stopPropagation()"
                        >
                            <toggle-opts
                                [showTransferOpt]="false"
                                (deleteEvent)="some()"
                                (editEvent)="some()"
                            />
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</section>

<app-pagination 
    [totalPages]="totalPages"
    [currentPage]="currentPage"
    [offset]="offset"
    [totalRegistries]="totalRegistries"
    [pageSize]="limit"
    (pageChange)="onPageChange($event)"
/>

<ng-template #nodata>
  <no-data />
</ng-template>
