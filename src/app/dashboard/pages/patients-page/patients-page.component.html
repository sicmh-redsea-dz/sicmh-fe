<custom-header 
  [headerText]="'pacientes'"
  [inputPlaceholder]="'Buscar pacientes'"
  [itemCounter]="totalRegistries"
  [btnRouterLink]="'new-patient'"
  [showCreateButton]="canCreatePatient()"
  (searchTerm)="onSearchTermChange( $event )"
/>
<section *ngIf="patients.length > 0; else nodata">
  <div class="user-table-container">
    <table class="user-table">
      <thead>
        <tr>
          <th style=" font-size: 1rem"><i class="ph-bold ph-user"></i></th>
          <th>Identidad</th>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Telefono</th>
          <th>nacimiento</th>
          <th></th>
        </tr>
      </thead>
      <tbody style="background-color: white;">
        <tr (click)="handleSelectedPatient(patient.id)" *ngFor="let patient of dataToRender(); let idx = index ">
          <td>
            <i class="ph-bold ph-user"></i>
          </td>
          <td>{{ patient.idNumber }}</td>
          <td>{{patient | formatFullname }}</td>
          <td>{{ patient.email }}</td>
          <td>{{ '+504 '+ patient.phone }}</td>
          <td><span class="badge date">{{ patient.birthDate| formatDate }}</span></td>
          <td class="opts-wrapper" (click)="$event.stopPropagation()">
            <toggle-opts 
              *ngIf="canViewPatient() || canEditPatient() || canDeletePatient()"
              [showViewOpt]="canViewPatient()"
              [showMovementsOpt]="canManageBilling()"
              [showEditOpt]="canEditPatient()"
              [showDeleteOpt]="canDeletePatient()"
              (viewEvent)="handleViewPatient(patient)"
              (movementsEvent)="handlePatientMovements(patient)"
              (editEvent)="handleSelectedPatient(patient.id)"
              (deleteEvent)="deleteSelectedPatient( patient.id )"
            />
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <app-pagination
    [totalPages]="totalPages"
    [currentPage]="currentPage"
    [offset]="offset"
    [totalRegistries]="totalRegistries"
    [pageSize]="limit"
    (pageChange)="onPageChange($event)"
  />
</section>

<ng-template #nodata>
  <no-data />
</ng-template>

<app-drawer />
