<div class="bill-table-container">
  <table class="bill-table">
    <thead>
      <tr>
        <th *ngFor="let h of headers; trackBy: trackBySelf">{{ h }}</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for(item of bodyContent; track $index) {
        <tr 
          (click)="handleRowClick(item)"
          [class.readonly]="!canEdit || item.Estado !== 'Pendiente'"
        >
          <td>{{ item.InvoiceNumber }}</td>
          <td>{{ item.Doctor }}</td>
          <td>{{ item.Paciente }}</td>
          <td><span [class]="'origin-badge ' + getInvoiceOriginClass(item.TipoVisita)">{{ getInvoiceOriginLabel(item.TipoVisita) }}</span></td>
          <td><span class="badge date">{{ item.FechaFactura.split('T')[0] }}</span></td>
          <td><span [className]="'badge ' + getStatusClass(item.Estado)">{{ item.Estado }}</span></td>
          <td>{{ item.Monto }}</td>
          <td class="opts-wrapper" (click)="$event.stopPropagation()">
            <toggle-opts
              *ngIf="canView || canEdit || canDelete"
              [isEditBlocked]="!canEdit || item.Estado !== 'Pendiente'"
              [showViewOpt]="canView"
              [showEditOpt]="canEdit"
              [showDeleteOpt]="canDelete"
              [deleteLabel]="deleteLabel"
              (viewEvent)="execItemView( item.InvoiceNumber )"
              (editEvent)="execItemUpdate( item.InvoiceNumber )"
              (deleteEvent)="execItemDeletion( item.InvoiceNumber )"
            />
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
