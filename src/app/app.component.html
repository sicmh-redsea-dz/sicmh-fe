<aside *ngIf="sessionActivity.warning()" role="status" style="position:sticky;top:0;z-index:10000;padding:12px 20px;background:#fff3cd;color:#493800;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap">
  <span>{{ sessionActivity.warning() }}</span>
  <button *ngIf="sessionActivity.canContinue()" type="button" (click)="sessionActivity.continueSession()">Continuar sesión</button>
</aside>

<app-loader *ngIf="!finishedAuthCheck()"/>

<router-outlet *ngIf="finishedAuthCheck()"/>
