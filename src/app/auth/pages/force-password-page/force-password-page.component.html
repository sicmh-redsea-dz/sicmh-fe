<div class="force-password-shell">
  <div class="force-password-card">
    <div class="header">
      <h1>Cambio de contraseña obligatorio</h1>
      <p>Por seguridad debes establecer una nueva contraseña antes de continuar.</p>
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nueva contraseña</label>
        <input type="password" formControlName="password" placeholder="Mínimo 8 caracteres">
        <small *ngIf="passwordForm.get('password')?.touched && passwordForm.get('password')?.invalid">
          La contraseña debe tener al menos 8 caracteres.
        </small>
      </div>

      <div class="form-group">
        <label>Confirmar contraseña</label>
        <input type="password" formControlName="confirmPassword" placeholder="Repite la contraseña">
        <small *ngIf="passwordForm.get('confirmPassword')?.touched && passwordForm.get('confirmPassword')?.invalid">
          Confirma la contraseña.
        </small>
      </div>

      <button class="primary-btn" type="submit" [disabled]="saving">
        {{ saving ? 'Guardando...' : 'Actualizar contraseña' }}
      </button>
    </form>
  </div>
</div>
