<form class="auth-form" autocomplete="off" [formGroup]="form" (ngSubmit)="submit()">
  <span class="form-title">Recuperar contraseña</span>
  <p class="intro">Ingresa los datos de tu cuenta y te enviaremos un enlace seguro.</p>
  <div *ngIf="message" class="notice success">{{ message }}</div>
  <div *ngIf="error" class="notice error">{{ error }}</div>
  <ng-container *ngIf="!message">
    <label>Correo</label>
    <input type="email" formControlName="email" placeholder="Correo electrónico">
    <small *ngIf="form.get('email')?.touched && form.get('email')?.invalid">Ingresa un correo válido.</small>
    <label>Código de empresa</label>
    <input type="text" formControlName="codigoEmpresa" placeholder="Ej. HNCAMI" class="uppercase">
    <small *ngIf="form.get('codigoEmpresa')?.touched && form.get('codigoEmpresa')?.invalid">Debe contener entre 3 y 10 letras o números.</small>
    <button type="submit" [disabled]="form.invalid || loading">{{ loading ? 'Enviando...' : 'Enviar enlace' }}</button>
  </ng-container>
  <a routerLink="/auth/login" class="back-link">Volver al inicio de sesión</a>
</form>
