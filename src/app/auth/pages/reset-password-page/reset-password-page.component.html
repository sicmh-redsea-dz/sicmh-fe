<form class="auth-form" autocomplete="off" [formGroup]="form" (ngSubmit)="submit()">
  <span class="form-title">Nueva contraseña</span>
  <p class="intro" *ngIf="!completed">Escribe una contraseña nueva para tu cuenta.</p>
  <div *ngIf="error" class="notice error">{{ error }}</div>

  <ng-container *ngIf="!completed">
    <label>Nueva contraseña</label>
    <input type="password" formControlName="password" placeholder="Mínimo 8 caracteres">
    <small *ngIf="form.get('password')?.touched && form.get('password')?.invalid">Debe contener entre 8 y 128 caracteres.</small>
    <label>Confirmar contraseña</label>
    <input type="password" formControlName="confirmPassword" placeholder="Repite la contraseña">
    <small *ngIf="form.get('confirmPassword')?.touched && form.get('confirmPassword')?.invalid">Confirma la nueva contraseña.</small>
    <button type="submit" [disabled]="form.invalid || loading || !!error && (!token || !codigoEmpresa)">{{ loading ? 'Actualizando...' : 'Actualizar contraseña' }}</button>
  </ng-container>

  <div *ngIf="completed" class="notice success">Tu contraseña fue actualizada correctamente.</div>
  <button *ngIf="completed" type="button" (click)="goToLogin()">Iniciar sesión</button>
  <a *ngIf="!completed" routerLink="/auth/login" class="back-link">Volver al inicio de sesión</a>
</form>
